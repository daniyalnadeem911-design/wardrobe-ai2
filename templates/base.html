<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WardrobeAI — Your Personal AI Wardrobe Assistant{% endblock %}</title>
  <meta name="description" content="WardrobeAI analyzes your clothes and generates outfit recommendations based on occasion, weather, and your style — powered by AI." />
  <meta name="google-site-verification" content="YOUR_REAL_VERIFICATION_CODE_HERE" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}" />
</head>
<body class="{{ 'dark' if page_theme == 'dark' else '' }}">
  <nav class="navbar">
    <a href="/" class="logo">WardrobeAI</a>
    <button id="nav-toggle" class="nav-toggle" aria-label="Open menu">☰</button>
    <div class="nav-links" id="nav-links">
      {% if session.get('user_id') %}
      <a href="/dashboard">Dashboard</a>
      <a href="/wardrobe">Wardrobe</a>
      <a href="/generate-outfit">Generate</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7 A5 5 0 0 0 12 17 Z" />
          <path d="M12 7 A5 5 0 0 1 12 17 Z" fill="currentColor" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
      <button id="logout-btn" class="btn-secondary">Log out</button>
      {% else %}
      <a href="/login">Log in</a>
      <a href="/signup" class="btn-primary">Sign Up</a>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
